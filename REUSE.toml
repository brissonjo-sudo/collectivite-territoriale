version = 1
SPDX-PackageName = "collectivite-territoriale"
SPDX-PackageDownloadLocation = "https://github.com/brissonjo-sudo/collectivite-territoriale"

# Code, skills, scripts, tests et manifestes : EUPL 1.2 (ADR 0030).
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan BRISSON (@brissonjo-sudo)"
SPDX-License-Identifier = "EUPL-1.2"

# Documentation : reste sous CC-BY-SA-4.0.
[[annotations]]
path = "docs/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Jonathan BRISSON (@brissonjo-sudo)"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Ponytail : outil tiers, licence MIT d'origine (voir .agents/skills/ponytail/LICENSE).
[[annotations]]
path = ".agents/skills/ponytail/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 DietrichGebert"
SPDX-License-Identifier = "MIT"
