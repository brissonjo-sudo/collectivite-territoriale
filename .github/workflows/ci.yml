name: Validation du plugin

on:
  push:
  pull_request:

jobs:
  vibe-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer la version Vibe contrôlée
        run: python -m pip install mistral-vibe==2.26.0
      - name: Vérifier les frontières de l'adaptateur
        run: python -m unittest discover -s tests -p test_vibe.py
      - name: Charger le runtime commun dans Vibe, sans modèle ni réseau
        run: python scripts/check_vibe.py
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contrôler les copies figées
        run: python scripts/check_sync.py
      - name: Vérifier le détecteur de dérive
        run: python -m unittest discover -s tests
      - name: Contrôler les pointeurs inter-dépôts
        run: |
          if rg -n '\b(Dpm-fpt|Drh-fpt|Dpo-ct|DirFi-fpt|droit-francais-skill)/[^[:space:]`]+\.md' skills; then
            exit 1
          fi
