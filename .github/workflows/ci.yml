name: Validation du plugin

on:
  push:
  pull_request:

jobs:
  validate:
    name: Intégration candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique et étiquettes complets : l'étiquette distribuée est vérifiée.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier l'étiquette distribuée par la marketplace
        env:
          CT_EXIGER_ETIQUETTE: "1"
        run: python -m unittest tests.test_codex_plugin.CodexPluginTests.test_etiquette_designe_le_commit_epingle
      - name: Contrôler les copies figées
        run: python scripts/check_sync.py
      - name: Lancer tous les tests hors barrière de publication
        env:
          CT_EXIGER_ETIQUETTE: "1"
          CT_SAUTER_BARRIERE: "1"
        run: python -m unittest discover -s tests
      - name: Contrôler les pointeurs inter-dépôts
        run: |
          if rg -n '\b(Dpm-fpt|Drh-fpt|Dpo-ct|DirFi-fpt|DCP-fpt|droit-francais-skill)/[^[:space:]`]+\.md' skills; then
            exit 1
          fi

  release:
    name: Qualification de publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contrôler la barrière de publication
        env:
          CT_SAUTER_BARRIERE: "0"
        run: python -m unittest discover -s tests -k ReleaseGateTests
