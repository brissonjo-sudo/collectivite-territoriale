name: Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Workflow et script figés au même commit de ci-tooling : une modification
    # de ci-tooling ne s'applique ici qu'après mise à jour explicite des deux SHA.
    uses: brissonjo-sudo/ci-tooling/.github/workflows/auto-review.yml@4a114581d3b2a5eb4b369da4dc86de1c6b02eeb7
    permissions:
      contents: read
      pull-requests: write
    # Seules les deux clés de relecture sont transmises, jamais les autres secrets.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    with:
      tooling-ref: 4a114581d3b2a5eb4b369da4dc86de1c6b02eeb7
